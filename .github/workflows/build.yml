name: Build RoMote Emerald

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build APK
        run: ./gradlew testFossDebugUnitTest assembleFossDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RoMote-Emerald-debug
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
