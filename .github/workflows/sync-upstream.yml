name: Sync upstream and publish

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ROMOTE_EMERALD_KEYSTORE_PASSWORD: ${{ secrets.ROMOTE_EMERALD_KEYSTORE_PASSWORD }}
      ROMOTE_EMERALD_KEY_ALIAS: ${{ secrets.ROMOTE_EMERALD_KEY_ALIAS }}
      ROMOTE_EMERALD_KEY_PASSWORD: ${{ secrets.ROMOTE_EMERALD_KEY_PASSWORD }}
      ROMOTE_EMERALD_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out Emerald branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch and merge official RoMote
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wseemann/RoMote.git
          git fetch upstream master --tags
          BEFORE="$(git rev-parse HEAD)"
          if ! git merge --no-edit upstream/master; then
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Upstream merge needs attention in:title' --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Upstream merge needs attention" \
              --body "The scheduled Emerald update could not merge the latest official RoMote master branch automatically. Resolve the workflow conflict manually, then rerun this workflow."
          fi
          exit 1

      - name: Require signing secrets
        if: steps.merge.outputs.conflict != 'true' && (steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64: ${{ secrets.ROMOTE_EMERALD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ROMOTE_EMERALD_KEYSTORE_PASSWORD"
          test -n "$ROMOTE_EMERALD_KEY_ALIAS"
          test -n "$ROMOTE_EMERALD_KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/romote-emerald.jks"
          echo "ROMOTE_EMERALD_KEYSTORE_FILE=$RUNNER_TEMP/romote-emerald.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release
        if: steps.merge.outputs.conflict != 'true' && (steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: ./gradlew testFossDebugUnitTest assembleFossRelease

      - name: Verify signed APK
        if: steps.merge.outputs.conflict != 'true' && (steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$apksigner" verify app/build/outputs/apk/foss/release/app-foss-release.apk

      - name: Verify this APK can update the preceding signed Emerald release
        if: steps.merge.outputs.conflict != 'true' && (steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          current=app/build/outputs/apk/foss/release/app-foss-release.apk
          current_line="$("$tools_dir/aapt" dump badging "$current" | grep '^package: ' | head -n 1)"
          current_code="$(printf '%s\n' "$current_line" | grep -oP "versionCode='\\K[0-9]+")"
          current_package="$(printf '%s\n' "$current_line" | grep -oP "name='\\K[^']+")"
          test "$current_package" = 'wseemann.media.romote.emerald'
          previous="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("emerald-upstream-"))] | first | .tagName // empty')"
          if [ -n "$previous" ]; then
            mkdir -p "$RUNNER_TEMP/older"
            gh release download "$previous" --pattern '*.apk' --dir "$RUNNER_TEMP/older"
            old_apk="$(find "$RUNNER_TEMP/older" -name '*.apk' -type f | head -1)"
            test -s "$old_apk"
            prior_line="$("$tools_dir/aapt" dump badging "$old_apk" | grep '^package: ' | head -n 1)"
            old_code="$(printf '%s\n' "$prior_line" | grep -oP "versionCode='\\K[0-9]+")"
            old_package="$(printf '%s\n' "$prior_line" | grep -oP "name='\\K[^']+")"
            current_cert="$("$tools_dir/apksigner" verify --print-certs "$current" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF;exit}')"
            old_cert="$("$tools_dir/apksigner" verify --print-certs "$old_apk" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF;exit}')"
            test -n "$old_cert" && test "$current_cert" = "$old_cert" || { echo "::error::Signing identity changed"; exit 1; }
            test "$current_package" = "$old_package" || { echo "::error::Android application ID changed"; exit 1; }
            if [ "$current_code" -le "$old_code" ]; then echo "::error::versionCode has not increased"; exit 1; fi
          fi

      - name: Push verified upstream merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Publish APK release
        if: steps.merge.outputs.conflict != 'true' && (steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          upstream_sha="$(git rev-parse --short=12 upstream/master)"
          tag="emerald-upstream-$upstream_sha-${{ github.run_number }}"
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "RoMote-Emerald-$upstream_sha.apk"
          gh release create "$tag" "RoMote-Emerald-$upstream_sha.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RoMote Emerald – upstream $upstream_sha" \
            --notes "Signed RoMote Emerald build based on official RoMote commit $upstream_sha. Includes the Emerald notification remote, Quick Settings access, widget theme, and branding modifications."
